spring:
  application:
    name: omniflow-worker
  main:
    web-application-type: servlet
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/omniflow}
    username: ${DATABASE_USERNAME:omniflow}
    password: ${DATABASE_PASSWORD:omniflow_dev_password}
    hikari:
      maximum-pool-size: ${WORKER_DB_POOL_SIZE:15}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    # The API process owns schema migrations; the worker waits for API health before starting.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:omniflow}
    password: ${RABBITMQ_PASSWORD:omniflow_dev_password}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        concurrency: 2
        max-concurrency: 8
        prefetch: 20
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 5
          multiplier: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081
  error:
    include-message: never

omniflow:
  security:
    jwt-secret: ${OMNIFLOW_JWT_SECRET:dev-only-change-me-omniflow-jwt-secret-at-least-32-bytes}
    access-ttl: ${OMNIFLOW_JWT_ACCESS_TTL:PT8H}
    refresh-ttl: ${OMNIFLOW_JWT_REFRESH_TTL:P30D}
    encryption-key: ${OMNIFLOW_ENCRYPTION_KEY:dev-only-change-me-omniflow-encryption-key}
  outbox:
    publisher:
      enabled: true
    poll-interval-ms: ${OMNIFLOW_OUTBOX_POLL_MS:1000}
  scheduler:
    enabled: true
  rabbit:
    exchange: ${OMNIFLOW_RABBIT_EXCHANGE:omniflow.events}
  import:
    staging-dir: ${IMPORT_STAGING_DIR:./data/imports}
    max-chunk-bytes: ${IMPORT_MAX_CHUNK_BYTES:33554432}
    lock-seconds: ${IMPORT_LOCK_SECONDS:3600}
    max-attempts: ${IMPORT_MAX_ATTEMPTS:5}
    recovery-interval-ms: ${IMPORT_RECOVERY_INTERVAL_MS:60000}
    recovery-initial-delay-ms: ${IMPORT_RECOVERY_INITIAL_DELAY_MS:45000}
    cleanup-interval-ms: ${IMPORT_CLEANUP_INTERVAL_MS:3600000}
    cleanup-initial-delay-ms: ${IMPORT_CLEANUP_INITIAL_DELAY_MS:120000}
  rate-limit:
    email-per-minute: ${OMNIFLOW_RATE_EMAIL_PER_MIN:600}
    whatsapp-per-minute: ${OMNIFLOW_RATE_WHATSAPP_PER_MIN:300}
    sms-per-minute: ${OMNIFLOW_RATE_SMS_PER_MIN:300}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:omniflow-dev-verify-token}
    app-secret: ${WHATSAPP_APP_SECRET:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-version: ${WHATSAPP_API_VERSION:v21.0}
  email:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    starttls: ${SMTP_STARTTLS:false}
    from: ${SMTP_FROM:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.omniflow: INFO
    org.hibernate.SQL: WARN
