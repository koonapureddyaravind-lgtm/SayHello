spring:
  application:
    name: omniflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/omniflow}
    username: ${DATABASE_USERNAME:omniflow}
    password: ${DATABASE_PASSWORD:omniflow_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:omniflow}
    password: ${RABBITMQ_PASSWORD:omniflow_dev_password}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 5
          multiplier: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${IMPORT_MAX_CHUNK_MB:64}MB
      max-request-size: ${IMPORT_MAX_CHUNK_MB:64}MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never

omniflow:
  security:
    jwt-secret: ${OMNIFLOW_JWT_SECRET:dev-only-change-me-omniflow-jwt-secret-at-least-32-bytes}
    access-ttl: ${OMNIFLOW_JWT_ACCESS_TTL:PT8H}
    refresh-ttl: ${OMNIFLOW_JWT_REFRESH_TTL:P30D}
    encryption-key: ${OMNIFLOW_ENCRYPTION_KEY:dev-only-change-me-omniflow-encryption-key}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  outbox:
    publisher:
      enabled: false
    poll-interval-ms: 2000
  scheduler:
    enabled: false
  demo:
    enabled: ${OMNIFLOW_DEMO_DATA:false}
    email: ${OMNIFLOW_DEMO_EMAIL:owner@omniflow.local}
    password: ${OMNIFLOW_DEMO_PASSWORD:OmniFlow123!}
    organization: ${OMNIFLOW_DEMO_ORG:Acme Retail}
  rate-limit:
    email-per-minute: ${OMNIFLOW_RATE_EMAIL_PER_MIN:600}
    whatsapp-per-minute: ${OMNIFLOW_RATE_WHATSAPP_PER_MIN:300}
    sms-per-minute: ${OMNIFLOW_RATE_SMS_PER_MIN:300}
  rabbit:
    exchange: ${OMNIFLOW_RABBIT_EXCHANGE:omniflow.events}
  import:
    staging-dir: ${IMPORT_STAGING_DIR:./data/imports}
    max-chunk-bytes: ${IMPORT_MAX_CHUNK_BYTES:33554432}
    max-file-bytes: ${IMPORT_MAX_FILE_BYTES:0}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:omniflow-dev-verify-token}
    app-secret: ${WHATSAPP_APP_SECRET:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-version: ${WHATSAPP_API_VERSION:v21.0}
  email:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    starttls: ${SMTP_STARTTLS:false}
    from: ${SMTP_FROM:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.omniflow: INFO
    org.hibernate.SQL: WARN
