# ============================================================================
# Postal configuration TEMPLATE (postal.example.yml)
# ----------------------------------------------------------------------------
# Copy this to your Coolify SERVER as /opt/postal/config/postal.yml and fill in
# every CHANGE_ME. The compose bind-mounts /opt/postal/config at /config.
#
# Generate the two secrets on the server (never commit them):
#   openssl genrsa -out /opt/postal/config/signing.key 2048
#   openssl rand -hex 64        # -> rails.secret_key below
#
# IMPORTANT: main_db.password / message_db.password MUST equal POSTAL_DB_PASSWORD
# in the compose/Coolify env, and rabbitmq.password MUST equal
# POSTAL_RABBITMQ_PASSWORD. Postal reads this file literally (no env substitution),
# so keep the values in sync by hand.
#
# Replace every "postal.yourdomain.com" / "yourdomain.com" with your real domain.
# After Postal is running, add each client's sending domain in the UI; Postal
# generates the exact DKIM/SPF/MX records to publish at that domain's DNS.
# ============================================================================

version: 2

postal:
  web_hostname: postal.yourdomain.com
  web_protocol: https
  smtp_hostname: postal.yourdomain.com
  use_ip_pools: false
  signing_key_path: $config-file-root/signing.key

main_db:
  host: mariadb
  username: postal
  password: CHANGE_ME_same_as_POSTAL_DB_PASSWORD
  database: postal

message_db:
  host: mariadb
  username: postal
  password: CHANGE_ME_same_as_POSTAL_DB_PASSWORD
  prefix: postal

rabbitmq:
  host: rabbitmq
  port: 5672
  username: postal
  password: CHANGE_ME_same_as_POSTAL_RABBITMQ_PASSWORD
  vhost: postal

redis:
  host: redis
  port: 6379

web_server:
  default_port: 5000

smtp_server:
  default_bind_address: "::"
  default_port: 25

dns:
  mx_records:
    - mx.postal.yourdomain.com
  spf_include: spf.postal.yourdomain.com
  return_path_domain: rp.postal.yourdomain.com
  route_domain: routes.postal.yourdomain.com
  track_domain: track.postal.yourdomain.com

rails:
  secret_key: CHANGE_ME_openssl_rand_hex_64